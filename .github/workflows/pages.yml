name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject view selector and pagination
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assets = [
              ('</head>', '<link rel="stylesheet" href="view-selector.css">', 'view-selector.css'),
              ('</head>', '<link rel="stylesheet" href="pagination.css">', 'pagination.css'),
              ('</body>', '<script src="view-selector.js" defer></script>', 'view-selector.js'),
              ('</body>', '<script src="pagination.js" defer></script>', 'pagination.js'),
          ]
          for marker, tag, needle in assets:
              if needle not in s:
                  s = s.replace(marker, tag + marker)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
